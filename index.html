<!DOCTYPE html>

<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MS Charles Dickens – Reisekarte</title>

  <link

    rel="stylesheet"

    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

  />

  <style>

    html, body {

      height: 100%;

      margin: 0;

    }

    #map {

      width: 100%;

      height: 100%;

    }

  </style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // Karte erstellen

  const map = L.map('map').setView([50.2, 10.5], 6);

  // OpenStreetMap laden

  L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

      maxZoom: 19,

      attribution: '&copy; OpenStreetMap'

    }

  ).addTo(map);

  // Amsterdam

  const amsterdam = [52.3676, 4.9041];

  L.marker(amsterdam)

    .addTo(map)

    .bindPopup(

      '<b>⚓ Amsterdam</b><br>Start der Reise mit der MS Charles Dickens'

    );

  // Wien

  const wien = [48.2082, 16.3738];

  L.marker(wien)

    .addTo(map)

    .bindPopup(

      '<b>🏛️ Wien</b><br>Ziel der Reise'

    );

  // Verbindungslinie

  const route = L.polyline(

    [amsterdam, wien],

    {

      color: '#176fbd',

      weight: 4

    }

  ).addTo(map);

  // Karte automatisch passend ausrichten

  map.fitBounds(route.getBounds(), {

    padding: [50, 50]

  });

</script>

</body>

</html>
