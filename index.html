<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MS Charles Dickens – Interaktive Reisekarte</title>

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>
 
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body {

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: #f4f1ea;

    color: #243447;

}

header {

    background: linear-gradient(135deg, #123b5d, #1f5f8b);

    color: white;

    padding: 22px 20px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 30px;

}

header p {

    margin-top: 8px;

    margin-bottom: 15px;

    font-size: 17px;

}

.controls {

    display: flex;

    justify-content: center;

    gap: 10px;

}

button {

    border: none;

    border-radius: 20px;

    padding: 10px 18px;

    font-size: 16px;

    cursor: pointer;

    font-weight: bold;

}

#startButton {

    background: white;

    color: #123b5d;

}

#stopButton {

    background: #d9534f;

    color: white;

}

.container {

    display: flex;

    height: calc(100vh - 180px);

    min-height: 600px;

}

.sidebar {

    width: 320px;

    background: white;

    overflow-y: auto;

    padding: 20px;

    box-sizing: border-box;

    box-shadow: 2px 0 10px rgba(0,0,0,0.12);

    z-index: 1000;

}

.sidebar h2 {

    margin-top: 0;

    color: #123b5d;

}

.station {

    background: #f5f7f8;

    border-left: 5px solid #1f5f8b;

    margin-bottom: 10px;

    padding: 12px;

    border-radius: 8px;

    cursor: pointer;

}

.station:hover {

    background: #dfeaf2;

}

.station-number {

    display: inline-block;

    width: 27px;

    height: 27px;

    line-height: 27px;

    text-align: center;

    border-radius: 50%;

    background: #123b5d;

    color: white;

    font-weight: bold;

    margin-right: 8px;

}

.station-name {

    font-weight: bold;

    font-size: 16px;

}

.station-info {

    font-size: 13px;

    color: #555;

    margin-left: 39px;

    margin-top: 4px;

}

.map-container {

    flex: 1;

}

#map {

    width: 100%;

    height: 100%;

}

.number-marker {

    background: #123b5d;

    color: white;

    border: 3px solid white;

    border-radius: 50%;

    width: 34px;

    height: 34px;

    line-height: 34px;

    text-align: center;

    font-weight: bold;

    box-shadow: 0 2px 6px rgba(0,0,0,0.4);

}

.ship-marker {

    font-size: 34px;

    text-align: center;

    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));

}

footer {

    text-align: center;

    padding: 10px;

    background: #123b5d;

    color: white;

    font-size: 13px;

}

@media (max-width: 800px) {

    .container {

        flex-direction: column;

        height: auto;

    }

    .sidebar {

        width: 100%;

        max-height: 300px;

        box-shadow: none;

    }

    .map-container {

        height: 550px;

    }

    header h1 {

        font-size: 24px;

    }

}

</style>

</head>

<body>

<header>

    <h1>⚓ MS Charles Dickens</h1>

    <p>Meine interaktive Reise von Amsterdam nach Wien</p>

    <div class="controls">

        <button id="startButton">

            ▶ Reise starten

        </button>

        <button id="stopButton">

            ⏹ Reise stoppen

        </button>

    </div>

</header>

<div class="container">

<div class="sidebar">

<h2>🗺️ Meine Reisestationen</h2>

<div id="stationList"></div>

</div>

<div class="map-container">

<div id="map"></div>

</div>

</div>

<footer>

⚓ MS Charles Dickens – Meine persönliche Reisekarte

</footer>

<script>

/* Karte */

const map = L.map('map').setView([50.5, 9.5], 5);

/* OpenStreetMap */

L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

        maxZoom: 19,

        attribution: '&copy; OpenStreetMap-Mitwirkende'

    }

).addTo(map);

/* Reisestationen */

const stops = [

{

number: 1,

name: "Amsterdam",

coords: [52.3676, 4.9041],

info: "⚓ Start der Reise mit der MS Charles Dickens"

},

{

number: 2,

name: "Köln",

coords: [50.9375, 6.9603],

info: "⛪ Die berühmte Stadt am Rhein mit dem Kölner Dom"

},

{

number: 3,

name: "Koblenz",

coords: [50.3569, 7.5889],

info: "🌊 Deutsches Eck – Rhein und Mosel treffen sich"

},

{

number: 4,

name: "Oberes Mittelrheintal",

coords: [50.154, 7.72],

info: "🏰 Burgen, Weinberge und die legendäre Loreley"

},

{

number: 5,

name: "Rüdesheim",

coords: [49.9786, 7.9220],

info: "🍷 Wein, Drosselgasse und Rheinromantik"

},

{

number: 6,

name: "Miltenberg",

coords: [49.7045, 9.2644],

info: "🏘️ Historische Fachwerkstadt am Main"

},

{

number: 7,

name: "Würzburg",

coords: [49.7913, 9.9534],

info: "🏰 Würzburger Residenz und Weinberge"

},

{

number: 8,

name: "Bamberg",

coords: [49.8988, 10.9028],

info: "🏘️ Historische Altstadt und Altes Rathaus"

},

{

number: 9,

name: "Nürnberg",

coords: [49.4521, 11.0767],

info: "🏰 Kaiserburg und historische Altstadt"

},

{

number: 10,

name: "Regensburg",

coords: [49.0134, 12.1016],

info: "🌉 Steinerne Brücke und mittelalterliche Altstadt"

},

{

number: 11,

name: "Passau",

coords: [48.5667, 13.4319],

info: "🌊 Die Stadt der drei Flüsse"

},

{

number: 12,

name: "Wien",

coords: [48.2082, 16.3738],

info: "🏛️ Ziel der Reise – Wien an der Donau"

}

];

/* Route */

const riverRoute = [

[52.3676, 4.9041], // Amsterdam

[52.20, 5.05],

[51.95, 5.25],

[51.70, 5.80],

[51.40, 6.35],

[50.9375, 6.9603], // Köln

[50.75, 7.00],

[50.55, 7.20],

[50.3569, 7.5889], // Koblenz

[50.25, 7.70],

[50.154, 7.72],    // Mittelrhein

[50.05, 7.82],

[49.9786, 7.9220], // Rüdesheim

[49.92, 8.25],

[49.90, 8.60],

[49.82, 8.95],

[49.7045, 9.2644], // Miltenberg

[49.72, 9.55],

[49.7913, 9.9534], // Würzburg

[49.88, 10.30],

[49.8988, 10.9028], // Bamberg

[49.70, 11.00],

[49.4521, 11.0767], // Nürnberg

[49.20, 11.30],

[49.05, 11.65],

[49.0134, 12.1016], // Regensburg

[48.85, 12.65],

[48.70, 13.10],

[48.5667, 13.4319], // Passau

[48.44, 13.91],

[48.30, 14.60],

[48.27, 15.20],

[48.24, 15.70],

[48.2082, 16.3738] // Wien

];

const markers = [];

/* Stationsliste */

const stationList =

document.getElementById("stationList");

stops.forEach(stop => {

    

    const icon = L.divIcon({

        className: '',

        html:

        '<div class="number-marker">' +

        stop.number +

        '</div>',

        iconSize: [34,34],

        iconAnchor: [17,17]

    });

    const marker =

    L.marker(stop.coords, {

        icon: icon

    }).addTo(map);

    marker.bindPopup(

        '<div style="text-align:center">' +

        '<h3>' +

        stop.number + '. ' + stop.name +

        '</h3>' +

        '<p>' +

        stop.info +

        '</p>' +

        '</div>'

    );

    markers.push(marker);

    const stationDiv =

    document.createElement("div");

    stationDiv.className = "station";

    stationDiv.innerHTML =

        '<span class="station-number">' +

        stop.number +

        '</span>' +

        '<span class="station-name">' +

        stop.name +

        '</span>' +

        '<div class="station-info">' +

        stop.info +

        '</div>';

    stationDiv.onclick = function() {

        map.flyTo(

            stop.coords,

            9,

            {

                duration: 1.5

            }

        );

        marker.openPopup();

    };

    stationList.appendChild(stationDiv);

});

/* Reiseroute */
  
  const routeCoords = stops.map(stop => stop.coords);

// Reiseroute – weiße Kontur

const routeOutline = L.polyline(

    routeCoords,

    {

        color: "#ffffff",

        weight: 14,

        opacity: 0.95

    }

).addTo(map);

// Reiseroute – rote Hauptlinie

const route = L.polyline(

    routeCoords,

    {

        color: "#e53935",

        weight: 8,

        opacity: 1

    }

).addTo(map);

map.fitBounds(

    route.getBounds(),

    {

        padding: [40,40]

    }

);

/* Schiff */

const shipIcon = L.divIcon({

    className: '',

    html: '<div class="ship-marker">🚢</div>',

    iconSize: [40,40],

    iconAnchor: [20,20]

});

const ship =

L.marker(

    stops[0].coords,

    {

        icon: shipIcon,

        zIndexOffset: 1000

    }

).addTo(map);

/* Animation */

let journeyRunning = false;

let currentStop = 0;

let animationTimer;

/* Reise starten */

document.getElementById("startButton")

.onclick = function() {

    if (journeyRunning) return;

    journeyRunning = true;

    currentStop = 0;

    travelToNextStop();

};

/* Reise stoppen */

document.getElementById("stopButton")

.onclick = function() {

    journeyRunning = false;

    clearTimeout(animationTimer);

};

/* Nächste Station */

function travelToNextStop() {

    if (!journeyRunning) return;

    if (currentStop >= stops.length) {

        journeyRunning = false;

        return;

    }

    const stop =

    stops[currentStop];

    ship.setLatLng(stop.coords);

    map.flyTo(

        stop.coords,

        8,

        {

            duration: 2

        }

    );

    markers[currentStop]

    .openPopup();

    currentStop++;

    animationTimer =

    setTimeout(

        travelToNextStop,

        3500

    );

}

</script>

</body>

</html>
